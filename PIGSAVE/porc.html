<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../PIGSAVE/LDMV.css" />
        <title>LDMV</title>
    </head>
    <body>
        <div class="cache"></div>
        <div class="cache2"></div>
        <div class="coeur"></div>
        <main>
            <div class="rep" id="reponse">_B_B_Q_ </div>
            <div class="view0">
                <img src="../media/piggyporc.jpg" alt width="100%"
                    id="cochon" />
            </div>
            <div class="view1">
                <input
                    type="text"
                    placeholder="groin groin groin"
                    id="enter" />
                <button class="val" onclick="mot()" id="valider">
                    <div class="groin">
                        <div class="groin1"></div>
                        <div class="groin2"></div>
                    </div>

                </button>
            </div>
            <section>
                <div class="clavier">
                    <button class="btnGame" onclick="lettre('A')">A</button>
                    <button class="btnGame" onclick="lettre('B')">B</button>
                    <button class="btnGame" onclick="lettre('C')">C</button>
                    <button class="btnGame" onclick="lettre('D')">D</button>
                    <button class="btnGame" onclick="lettre('E')">E</button>
                    <button class="btnGame" onclick="lettre('F')">F</button>
                    <button class="btnGame" onclick="lettre('G')">G</button>
                    <button class="btnGame" onclick="lettre('H')">H</button>
                    <button class="btnGame" onclick="lettre('I')">I</button>
                    <button class="btnGame" onclick="lettre('J')">J</button>
                    <button class="btnGame" onclick="lettre('K')">K</button>
                    <button class="btnGame" onclick="lettre('L')">L</button>
                    <button class="btnGame" onclick="lettre('M')">M</button>
                    <button class="btnGame" onclick="lettre('N')">N</button>
                </div>
                <div class="clavier2">
                    <button class="btnGame">'</button>
                    <button class="btnGame" onclick="lettre('O')">O</button>
                    <button class="btnGame" onclick="lettre('P')">P</button>
                    <button class="btnGame" onclick="lettre('Q')">Q</button>
                    <button class="btnGame" onclick="lettre('R')">R</button>
                    <button class="btnGame" onclick="lettre('S')">S</button>
                    <button class="btnGame" onclick="lettre('T')">T</button>
                    <button class="btnGame">/</button>
                    <button class="btnGame" onclick="lettre('U')">U</button>
                    <button class="btnGame" onclick="lettre('V')">V</button>
                    <button class="btnGame" onclick="lettre('W')">W</button>
                    <button class="btnGame" onclick="lettre('X')">X</button>
                    <button class="btnGame" onclick="lettre('Y')">Y</button>
                    <button class="btnGame" onclick="lettre('Z')">Z</button>
                    <button class="btnGame">'</button>
                </div>
            </section>
        </main>
        <audio id="victoire" src="../song/SpiderCochon.mp3"
            preload="auto"></audio>
        <audio id="erreur" src="../song/erreurporc.mp3" preload="auto"></audio>
        <audio id="valide" src="../song/validporc.mp3" preload="auto"></audio>
        <audio id="start" src="../song/Oink.mp3" preload="auto"></audio>
        <audio id="defaite" src="../song/burger.mp3" preload="auto"></audio>
        <!-- oeil LDMV -->
        <div>
            <button class="bt1">
                <button class="bt2">
                    <button class="bt3">
                        <button class="bt4" onclick="visible()">LDMV</button>
                        <button class="bt5" onclick="reset()">groin
                            groin</button>
                    </button>
                </button>
            </button>
        </div>
    </body>
    <script src="../PIGSAVE/LDMV.js"></script>
</html>
